name: CI

# This repo had no CI at all: the only workflow was the GHCR image build, which
# runs on push to main (and a 'feature/**' glob that never matches the branch
# literally named `feature`). Nothing validated a pull request, which is how a
# tsconfig incompatible with TypeScript 7 reached main and broke the image build.
on:
  push:
    branches: [main, develop, feature]
  pull_request:
    branches: [main, develop, feature]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Keep this in step with `FROM node:24-alpine` in the Dockerfile and with
      # `engines.node` in package.json. Testing on the version actually shipped is
      # what makes runtime-specific failures visible — a CommonJS `require()` of an
      # ESM-only package (TS1479, which is how the `uuid` bug surfaced) behaves
      # differently across Node majors, since 22.12+ can require ESM and 20 cannot.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` is `tsc`, so this is both the build and the type-check.
      - name: Build (tsc)
        run: pnpm run build

      # Redis is faked in-process (src/lib/__tests__/redis-fake.ts), so this needs
      # no service container and no Docker. If real-Redis coverage is added later
      # it belongs in `*.integration.test.ts`, which vitest.config.ts excludes from
      # this run — wire it up as a separate step with a `services: redis` block.
      - name: Test
        run: pnpm test
