name: Build and Push Image to GHCR

on:
  # Release tags and manual runs ONLY (#756). The previous `push: branches:
  # [main, feature]` published a mutable `:main` / `:feature` tag on every merge;
  # nothing consumed them (deployments pin a release tag or an immutable sha- tag
  # in bluedots-automation's global-images.yaml). The `pull_request` build-without-
  # publish trigger is gone with them.
  push:
    tags:
      # Release tags only (was '**', which published an image on EVERY tag).
      # Matches the fleet standard (signals-dpg#570, aggregator-dpg#641,
      # signals-search#129), so one cross-repo cut tags every service's image
      # with the same release tag:
      #   v*.*.*      semver releases   e.g. v1.2.0
      #   20*-s*-rc*  sprint release    e.g. 202608-s1-rc1
      #               <YYYYMM>-s<sprint>-rc<candidate>. A fix for an issue found
      #               in -rc1 ships as -rc2, so every candidate is its own image.
      # GitHub reads this workflow FROM THE TAGGED COMMIT, so a tag cut from a
      # commit predating this change won't pick the new pattern up.
      - 'v*.*.*'
      - '20*-s*-rc*'
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: 'Publish even if CI has not passed for this commit (emergency use only)'
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate: refuse to publish an image built from a commit CI has not passed
  # (Blue-Dots-Economy/signals-dpg#765). This repo never had such a gate — the
  # image build has always been a separate workflow from ci.yaml — so unlike the
  # other three this closes a pre-existing hole rather than restoring one that
  # #756 removed.
  #
  # It asks about ci.yaml RUNS rather than individual check runs, so it stays
  # correct if the job names or the job graph inside CI ever change.
  #
  # Cheap by design: no re-run of the suite, just an API call. A release tag is
  # cut from develop or main, where CI has already run on that exact commit.
  verify-ci:
    name: Verify CI passed for this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # read workflow runs for this SHA
    steps:
      - name: Require a successful ci.yaml run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SKIP: ${{ inputs.skip_ci_check }}
        run: |
          set -euo pipefail

          # `inputs` is empty on a tag push, so this is false unless someone
          # dispatched with the box ticked.
          if [ "${SKIP:-false}" = "true" ]; then
            echo "::warning title=CI gate bypassed::Publishing ${SHA} without checking CI, because skip_ci_check was set on this dispatch."
            exit 0
          fi

          runs=$(gh api --paginate \
            "repos/${REPO}/actions/workflows/ci.yaml/runs?head_sha=${SHA}" \
            --jq '.workflow_runs[] | "\(.status)/\(.conclusion // "pending")\t\(.event)\t\(.html_url)"')

          # FAIL CLOSED on no runs at all. This is the realistic accident: a tag
          # cut from a commit CI never saw (a feature branch, a local commit),
          # not a tag cut from a red one. A check for "not failed" would pass it.
          if [ -z "${runs}" ]; then
            echo "::error title=No CI run for this commit::ci.yaml has never run for ${SHA}, so there is nothing to verify. Cut the release tag from a commit on develop or main that CI has already tested."
            exit 1
          fi

          echo "ci.yaml runs found for ${SHA}:"
          echo "${runs}" | sed 's/^/  /'

          if echo "${runs}" | grep -q '^completed/success'; then
            echo "CI passed for ${SHA} — proceeding to build."
            exit 0
          fi

          echo "::error title=CI did not pass::No successful ci.yaml run exists for ${SHA}. Fix CI on that commit and re-tag, or re-run this workflow manually with skip_ci_check if this is a deliberate emergency publish."
          exit 1

  build-and-push:
    needs: verify-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy image scan uploads SARIF to code-scanning

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The DHI base layers in the Dockerfile come from dhi.io, which refuses
      # anonymous pulls even for the free Apache-2.0 catalog. Without these
      # credentials the build fails at the first FROM.
      - name: Log in to dhi.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        # Not needed on the PR path, which only builds. Skipping also keeps
        # Dependabot-raised PRs working, where GITHUB_TOKEN is read-only.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
              # `:latest` now follows RELEASES, not the main branch. The branch arm
            # of this condition went with the branch trigger.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          # Single platform on PRs: the arm64 leg is emulated through QEMU and
          # roughly doubles the run for a check whose job is only to prove the
          # image still builds. Pushes keep both.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image scanning (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300).
      # Scans the OS + system packages baked into the shipped artifact, which the
      # source/lockfile scan in security.yml structurally cannot see (an outdated
      # base-image library appears in no package.json).
      #
      # IMAGE_NAME is `github.repository`, which preserves the org's capitalisation
      # ("Blue-Dots-Economy"). docker/metadata-action lowercases that for its own tag
      # outputs, but an image reference we build by hand must be normalised too —
      # an uppercase path is an invalid reference and Trivy would reject it.
      - name: Resolve scanned image ref
        id: scanref
        run: echo "ref=${IMAGE,,}@${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # Scanned by digest, not by tag: buildx pushes straight to the registry without
      # loading into the local docker image store, so the action's `imageid` output is
      # not resolvable by Trivy. Every run of this workflow now pushes, so the digest
      # always refers to something that exists in the registry.
      #
      # TRIVY_PLATFORM is pinned because pushes build a linux/amd64 + linux/arm64
      # manifest list; the digest therefore points at the list rather than one image,
      # and picking the platform explicitly keeps results comparable between runs.
      - name: Trivy image scan
        if: steps.scanref.outputs.ref != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ steps.scanref.outputs.ref }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # Phase A: report-only, never fails the build

      - name: Upload Trivy image SARIF
        if: always() && steps.scanref.outputs.ref != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-notification
