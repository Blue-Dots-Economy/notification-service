name: Build and Push Image to GHCR

on:
  push:
    branches:
      - main
      # `feature`, not 'feature/**'. The glob requires a slash, so it never
      # matched the integration branch every PR targets — across the last 20 runs
      # this workflow had only ever run on main and a few test/* branches. The
      # branch tag from docker/metadata-action is therefore `:feature`.
      - feature
    tags:
      # Release tags only (was '**', which published an image on EVERY tag).
      # Matches the fleet standard (signals-dpg#570, aggregator-dpg#641,
      # signals-search#129), so one cross-repo cut tags every service's image
      # with the same release tag:
      #   v*.*.*      semver releases   e.g. v1.2.0
      #   20*-s*-rc*  sprint release    e.g. 202608-s1-rc1
      #               <YYYYMM>-s<sprint>-rc<candidate>. A fix for an issue found
      #               in -rc1 ships as -rc2, so every candidate is its own image.
      #               Supersedes the dated GA-<date> scheme, no longer built here.
      # GitHub reads this workflow FROM THE TAGGED COMMIT, so a tag cut from a
      # commit predating this change won't pick the new pattern up.
      # (type=ref,event=tag below already tags the image verbatim with the tag.)
      - 'v*.*.*'
      - '20*-s*-rc*'
  # Build (without publishing) on PRs that touch the image inputs, so a broken
  # Dockerfile is caught in review instead of on a shared branch. This is not
  # hypothetical: moving pnpm `overrides` into pnpm-workspace.yaml broke the
  # build with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH because the Dockerfile did not
  # copy that file, and nothing ran the build to notice.
  pull_request:
    paths:
      - Dockerfile
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - src/**
      - .github/workflows/notification-image-build.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Fork PRs get no repository secrets/vars, so the dhi.io login step below
    # throws `Password required` before it ever reaches `FROM` — a red build
    # the contributor has no way to fix. Skip entirely rather than fail; push
    # and same-repo pull_request runs are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy image scan uploads SARIF to code-scanning

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The DHI base layers in the Dockerfile come from dhi.io, which refuses
      # anonymous pulls even for the free Apache-2.0 catalog. Deliberately NOT
      # gated on `github.event_name != 'pull_request'` like the GHCR login
      # below: the PR path still BUILDS (it only skips the push), and the build
      # fails at the first FROM without these credentials.
      - name: Log in to dhi.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        # Not needed on the PR path, which only builds. Skipping also keeps
        # Dependabot-raised PRs working, where GITHUB_TOKEN is read-only.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          # Single platform on PRs: the arm64 leg is emulated through QEMU and
          # roughly doubles the run for a check whose job is only to prove the
          # image still builds. Pushes keep both.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image scanning (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300).
      # Scans the OS + system packages baked into the shipped artifact, which the
      # source/lockfile scan in security.yml structurally cannot see (an outdated
      # base-image library appears in no package.json).
      #
      # IMAGE_NAME is `github.repository`, which preserves the org's capitalisation
      # ("Blue-Dots-Economy"). docker/metadata-action lowercases that for its own tag
      # outputs, but an image reference we build by hand must be normalised too —
      # an uppercase path is an invalid reference and Trivy would reject it.
      # Gated on the EVENT, not on `digest != ''`. Those look equivalent but are not:
      # with the default docker driver, build-push-action populates `digest` from the
      # locally-built image even when `push: false`, and Trivy would then resolve a
      # digest for an image that is in no registry (MANIFEST_UNKNOWN). This job does
      # configure buildx, where the output is empty on the PR path — but gating on
      # the same condition that drives `push:` above does not depend on that detail.
      - name: Resolve scanned image ref
        id: scanref
        if: github.event_name != 'pull_request'
        run: echo "ref=${IMAGE,,}@${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # Scanned by digest, not by tag: buildx pushes straight to the registry without
      # loading into the local docker image store, so the action's `imageid` output is
      # not resolvable by Trivy. `scanref` is empty on the PR path (see above), so this
      # step and the upload both skip there rather than failing on an absent image.
      #
      # TRIVY_PLATFORM is pinned because pushes build a linux/amd64 + linux/arm64
      # manifest list; the digest therefore points at the list rather than one image,
      # and picking the platform explicitly keeps results comparable between runs.
      - name: Trivy image scan
        if: steps.scanref.outputs.ref != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ steps.scanref.outputs.ref }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # Phase A: report-only, never fails the build

      - name: Upload Trivy image SARIF
        if: always() && steps.scanref.outputs.ref != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-notification
