version: 2

# Docker Hardened Image bases live on dhi.io, which refuses anonymous pulls — so
# without this Dependabot cannot read the manifests and base-image update PRs for
# any Dockerfile using `FROM dhi.io/...` simply stop appearing. Nothing errors,
# which is what makes it worth being explicit about.
#
# PREREQUISITE: these are DEPENDABOT secrets, a separate store from Actions
# secrets — set them under Settings > Secrets and variables > Dependabot.
# Note the username must be a secret here: Dependabot registry config cannot
# reference `vars`, which is what the Actions workflows use for it.
registries:
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_TOKEN}}
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "UTC"
    # The limit counts open *version-update* PRs. Grouped updates plus a singleton
    # can sit right at 5, after which Dependabot silently stops raising npm PRs —
    # indistinguishable from "nothing to update". Observed in aggregator-dpg on
    # 2026-08-04, where the production group PR appeared within minutes of slots
    # being freed. Matches aggregator-dpg and signals-search.
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

    ignore:
      # typescript-eslint does not support TS 7 yet — hold the major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Hold the vitest major. Now on 4.1.11, taken as the CVE-2026-84373 floor
      # (the advisory covers >= 2.1.0, < 4.1.11), so the old note about the fleet
      # sitting on 3.x is spent — signals-dpg and aggregator-dpg are on 4.x too.
      # What is held is v5, which Dependabot proposed via the security path and
      # which is a migration, not a bump: it clears mocks by default before each
      # test. This repo still has no vite of its own, so the sibling repos'
      # Vite 6.4 constraint is not the binding reason here — the mock semantics
      # are. The major stays held; 4.x patches and minors flow normally, which is
      # what the next advisory on this package will need.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # nodemailer v10 ships its types in-package and drops the `nodemailer`
      # global namespace that @types/nodemailer@^8 supplied. src/lib/providers/
      # email/sendMailCore.ts declares
      #   let transporter: nodemailer.Transporter<SMTPTransport.SentMessageInfo>
      # which is a reference to that namespace, so #122 fails the Docker build
      # outright with `TS2503: Cannot find namespace 'nodemailer'`. The fix is a
      # code change, not a bump — drop @types/nodemailer and switch to
      # `import type { Transporter } from 'nodemailer'` — and it is not something
      # to do inside a dependency PR on the repo that owns every outbound email.
      # Green types would not prove it either: nothing in CI performs an SMTP
      # round trip, and the SMTP transport here was only just variabilized (#114).
      # aggregator-dpg holds the same major in lockstep (its #750 is green but
      # would split the fleet across two majors of the mail library); the two move
      # together. 9.x patches and minors flow normally — that line is where the
      # last advisory arrived (nodemailer 9.1.1, #117).
      - dependency-name: "nodemailer"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — keeps CI workflow action versions current
  - package-ecosystem: "github-actions"
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:15"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker base image (root Dockerfile)
  - package-ecosystem: "docker"
    # Needed to read dhi.io manifests; see the registries block at the top.
    registries:
      - dhi
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:30"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
