version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    # The limit counts open *version-update* PRs. Grouped updates plus a singleton
    # can sit right at 5, after which Dependabot silently stops raising npm PRs —
    # indistinguishable from "nothing to update". Observed in aggregator-dpg on
    # 2026-08-04, where the production group PR appeared within minutes of slots
    # being freed. Matches aggregator-dpg and signals-search.
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

    ignore:
      # typescript-eslint does not support TS 7 yet — hold the major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vitest 4 needs vite 6 in lockstep — hold the major.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — keeps CI workflow action versions current
  - package-ecosystem: "github-actions"
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:15"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker base image (root Dockerfile)
  - package-ecosystem: "docker"
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
